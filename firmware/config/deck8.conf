# Deck-8 features. Board defaults (USB, BLE, flash layout) are in boards/deck8/deck8_nrf52840_zmk_defconfig.

# Knobs
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED status screen: battery, output, Bluetooth profile, layer
CONFIG_ZMK_DISPLAY=y

# Key LEDs and light ring (one effect across both chains)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# 25 LEDs share the 500 mA USB budget with charging: cap brightness at 40 %
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=40
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=260
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Battery level over BLE and on the OLED
CONFIG_ZMK_BATTERY_REPORTING=y

# Deep sleep after 15 min idle; any key wakes it
CONFIG_ZMK_SLEEP=y

# Live remapping with ZMK Studio (needs the studio-rpc-usb-uart snippet, see build.yaml)
CONFIG_ZMK_STUDIO=y
